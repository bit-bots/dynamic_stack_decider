[workspace]
name = "dynamic-stack-decider"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"

[feature.format.dependencies]
pre-commit = ">=4,<5"
ruff = "==0.16.10"

[feature.format.tasks]
format = "pre-commit run --all-files"
lint = "pre-commit run --all-files --hook-stage manual"

[feature.test.dependencies]
pytest = ">=8,<9"
pytest-cov = ">=6,<8"
mypy = ">=1.18,<3"
types-pyyaml = ">=6,<7"
python-build = ">=1,<2"
setuptools = ">=68,<81"
wheel = ">=0.45,<1"
pyyaml = ">=6,<7"

[feature.test.tasks]
test = { cmd = "pytest -p pytest_cov --cov=dynamic_stack_decider/dynamic_stack_decider --cov-report=term-missing", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1", ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST" } }
package = "python scripts/check_packages.py"
typecheck = "mypy dynamic_stack_decider/dynamic_stack_decider scripts examples"
demo = { cmd = "python examples/demo.py", env = { PYTHONPATH = "dynamic_stack_decider" } }

[feature.ros.dependencies]
ros-jazzy-rclpy = ">=7,<8"
ros-jazzy-std-msgs = ">=5,<6"

[feature.visualization.dependencies]
pyqt = ">=5.15,<6"
pyqt-stubs = ">=5.15,<6"
pydot = ">=3,<5"
ros-jazzy-qt-dotgraph = "*"
ros-jazzy-rqt-gui-py = "*"
ros-jazzy-ament-index-python = "*"

[feature.visualization.tasks]
typecheck-gui = "mypy dynamic_stack_decider_visualization/dynamic_stack_decider_visualization"

[feature.visualization.activation.env]
QT_QPA_PLATFORM = "offscreen"

[environments]
default = ["test", "ros"]
format = ["format"]
visualization = ["test", "ros", "visualization"]
