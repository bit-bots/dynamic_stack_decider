[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]
select = ["F", "E", "B", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["dynamic_stack_decider/test", "dynamic_stack_decider_visualization/test"]
pythonpath = ["dynamic_stack_decider", "dynamic_stack_decider_visualization"]
addopts = "--strict-config --strict-markers -ra"
