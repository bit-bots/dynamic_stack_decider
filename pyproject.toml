[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]
select = ["F", "E", "B", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/interactive_graphics_view.py" = ["N802"]
"**/dsd_visualization_plugin.py" = ["N802"]
"dynamic_stack_decider_visualization/test/test_*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["dynamic_stack_decider/test", "dynamic_stack_decider_visualization/test"]
pythonpath = ["dynamic_stack_decider", "dynamic_stack_decider_visualization"]
addopts = "--strict-config --strict-markers -ra"
markers = ["ros: integration test using ROS middleware"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["dynamic_stack_decider", "dynamic_stack_decider_visualization", "stubs"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["rclpy.*", "std_msgs.*", "ament_index_python.*", "PyQt5.uic"]
ignore_missing_imports = true
follow_imports = "skip"
